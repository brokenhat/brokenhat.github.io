title: Blue Stem
seo_title: Blue Stem, Kilim Tapestry (2024) — Dominik Zarzycki
description: Blue Stem (2024), a handwoven wool-on-wool tapestry stitched into a riband form, inspired by Mazandaran and jajim kilims. Shown at Dalkeith Palace.
year: '2024'
technique: handwoven tapestry
fibre: wool on wool
dimensions: approx 200cm high, 128cm wide
exhibition: Visual Arts Scotland — Now and Then — Dalkeith Palace, August 2024
image:
  file: PXL_20240219_175905460.jpg
  alt: Blue Stem
text: |
  Woven in one long strip and then stitched together to create spatial form of riband.

  It was made like that to highlight the technique of stitching together multiple strips of kilim to create larger one — as seen in multiple examples from weaving culture from the middle east — usually used as floor covering or wrap for other more precious textiles.

  This one is especially inspired by mazandaran and jajim kilims from northern Iran.

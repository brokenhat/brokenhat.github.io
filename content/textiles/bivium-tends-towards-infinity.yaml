title: Bivium tends towards infinity
seo_title: Bivium Tends Towards Infinity (2024) — Dominik Zarzycki
description: Bivium tends towards infinity (2024), a 193 × 77 cm tapestry in plant-dyed sisal, linen, silk, cotton and hand-spun wool, with copper wire and lurex.
year: '2024'
technique: tapestry
warp: cotton (20/12), 10 EPI
dimensions: height 193cm with fringe, 165cm without fringe; width 77cm
image:
  file: bivium_tends_towards_infinity.JPG
  alt: Bivium tends towards infinity
text: |
  **Materials**

  Plant dyed: sisal, linen, silk, cotton, wool (mostly hand-spun from the fleeces of various breeds, primarily Jacob sheep).

  Other: copper wire (wrapped around wool), lurex.

{% extends "base.html" %}
{% block title %}Code{% endblock %}
{% block body %}
<form method="post" class="card login">
  <h1>6-digit code</h1>
  <p class="hint">Open your authenticator app and type the code it shows for dominik-art.works.</p>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Code <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required autofocus></label>
  <button type="submit" class="primary">Log in</button>
  <p class="hint"><a href="{{ url_for('auth.login') }}">Start again</a></p>
</form>
{% endblock %}

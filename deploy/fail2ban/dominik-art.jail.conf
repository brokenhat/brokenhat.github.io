# /etc/fail2ban/jail.d/dominik-art.conf
[sshd]
enabled = true
maxretry = 6
findtime = 10m
bantime = 1h

# 10 failed admin logins in 15 minutes: that address is blocked for a day
[dominik-art-cms]
enabled = true
backend = systemd
journalmatch = _SYSTEMD_UNIT=dominik-art-cms.service
filter = dominik-art-cms
port = http,https
maxretry = 10
findtime = 15m
bantime = 1d

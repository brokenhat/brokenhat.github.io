# /etc/nginx/sites-available/dominik-art.works
# The portfolio (static files built by the CMS) and its admin at /admin/.

server {
    listen 80;
    listen [::]:80;
    server_name dominik-art.works;
    return 301 https://dominik-art.works$request_uri;
}

server {
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    server_name dominik-art.works;

    ssl_certificate /etc/letsencrypt/live/dominik-art.works/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dominik-art.works/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/dominik-art/www/current;
    index index.html;
    error_page 404 /404.html;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    location / {
        try_files $uri $uri/ =404;
    }

    # resized copies never change in place (a new original makes a new
    # file); originals, styles and scripts are kept for a shorter while
    location /thumbs/ { expires 30d; }
    location ~* \.(?:jpe?g|png|gif|webp|svg|ico)$ { expires 7d; }
    location ~* \.(?:css|js)$ { expires 1d; }

    # addresses of the old site, which search engines still know
    location = /index/              { return 301 /; }
    location = /Homepage/           { return 301 /; }
    location = /In-a-Zigzag-Way/    { return 301 /in-a-zigzag-way/; }
    location = /Textiles/           { return 301 /textiles/; }
    location = /Paintings/          { return 301 /paintings/; }
    location = /Generative/         { return 301 /generative/; }
    location = /Drawings/           { return 301 /drawings/; }
    location = /CV/                 { return 301 /cv.html; }
    location = /login               { return 301 /; }
    location ^~ /static/uploads/    { return 301 /; }

    # the admin
    location /admin/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 400m;          # a batch of phone photos
        proxy_read_timeout 900s;            # building a preview
        proxy_request_buffering off;
    }
    location ~ ^/admin/login {
        limit_req zone=cmslogin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

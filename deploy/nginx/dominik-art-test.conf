# /etc/nginx/sites-available/dominik-art-test - the new site on
# 127.0.0.1:8081 only (reachable through an ssh tunnel), to check it
# before dominik-art.works switches over. Removed after the switch.
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    root /srv/dominik-art/www/current;
    index index.html;
    error_page 404 /404.html;
    charset utf-8;
    location / { try_files $uri $uri/ =404; }
    location /admin/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 400m;
        proxy_read_timeout 900s;
    }
}
